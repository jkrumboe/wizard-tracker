    <style>
      /* Critical CSS - Theme variables for immediate loading */
      /* Keep in sync with src/styles/base/index.css so there is no colour jump
         when the real stylesheet loads. The accent below is the Wizard Blue
         default; initAccent() overwrites it with the user's choice. It is the
         same in both themes, so only the neutrals below differ. */
      :root {
        --primary: #3a81f5;
        --primary-dark: #1e66d8;
        --primary-light: #7daeff;
        --text: #0f172a;
        --text-light: #475569;
        --bg-color: #f4f6fa;
        --card-bg: #ffffff;
        --border-light: #eaeef4;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.20);
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
      }

      /* Dark theme detection and variables */
      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #3a81f5;
          --primary-dark: #1e66d8;
          --primary-light: #7daeff;
          --text: #f1f5f9;
          --text-light: #cbd5e1;
          --bg-color: #0b1120;
          --card-bg: #161e2e;
          --border-light: #3a4760;
          --shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
        }
      }

      /* Manual dark theme override */
      [data-theme="dark"] {
        --primary: #3a81f5;
        --primary-dark: #1e66d8;
        --primary-light: #7daeff;
        --text: #f1f5f9;
        --text-light: #cbd5e1;
        --bg-color: #0b1120;
        --card-bg: #161e2e;
        --border-light: #3a4760;
        --shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
      }

      /* Prevent any white flashes */
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--bg-color);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        background-color: var(--bg-color);
        transition: background-color 0.3s ease;
      }

      /* Startup splash: the KeepWiz mark assembles itself (tile → cards fan
         out → star ignites → sparkles), then the wordmark rises in. The tile
         gradient reads the accent tokens so it matches the user's colour. */
      .pwa-loading {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        overflow: hidden;
        transition: opacity 0.5s ease, visibility 0.5s;
      }

      .pwa-loading.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pwa-loading.fade-out .kw-stage {
        transform: scale(1.06);
        filter: blur(3px);
      }

      /* Soft accent aura behind the mark */
      .kw-aura {
        position: absolute;
        width: 520px;
        height: 520px;
        max-width: 140vw;
        max-height: 140vw;
        border-radius: 50%;
        background: radial-gradient(circle, var(--primary) 0%, transparent 62%);
        opacity: 0;
        animation: kwAura 1.2s ease-out 0.1s forwards, kwBreathe 4s ease-in-out 1.3s infinite;
        pointer-events: none;
      }

      @keyframes kwAura {
        from { opacity: 0; transform: scale(0.4); }
        to   { opacity: 0.18; transform: scale(1); }
      }

      @keyframes kwBreathe {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50%      { opacity: 0.26; transform: scale(1.06); }
      }

      .kw-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 0 16px;
        text-align: center;
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
      }

      .kw-mark {
        width: 132px;
        height: 132px;
        overflow: visible;
        filter: drop-shadow(0 14px 28px rgba(15, 30, 80, 0.28));
        animation: kwPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .kw-mark * { transform-box: view-box; }
      .kw-stop { stop-color: var(--primary); }
      .kw-stop-light { stop-color: var(--primary-light); }
      .kw-stop-dark { stop-color: var(--primary-dark); }

      @keyframes kwPop {
        from { opacity: 0; transform: scale(0.55) rotate(-8deg); }
        to   { opacity: 1; transform: scale(1) rotate(0); }
      }

      .kw-back {
        transform-origin: 256px 390px;
        animation: kwFan 0.65s cubic-bezier(0.34, 1.4, 0.64, 1) 0.4s both;
      }

      @keyframes kwFan {
        from { opacity: 0; transform: rotate(22deg); }
        to   { opacity: 1; transform: rotate(0); }
      }

      .kw-front {
        transform-origin: 271px 300px;
        animation: kwDeal 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) 0.25s both;
      }

      @keyframes kwDeal {
        from { opacity: 0; transform: translateY(70px) scale(0.85); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .kw-star {
        transform-origin: 271px 262px;
        animation: kwIgnite 0.6s cubic-bezier(0.34, 1.7, 0.64, 1) 0.7s both,
                   kwPulse 2.4s ease-in-out 1.4s infinite;
      }

      @keyframes kwIgnite {
        from { opacity: 0; transform: scale(0) rotate(-120deg); }
        to   { opacity: 1; transform: scale(1) rotate(0); }
      }

      @keyframes kwPulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.08); }
      }

      .kw-spark-a,
      .kw-spark-b {
        opacity: 0;
        animation: kwSpark 0.5s cubic-bezier(0.34, 1.7, 0.64, 1) both,
                   kwTwinkle 2s ease-in-out infinite;
      }

      .kw-spark-a {
        transform-origin: 368px 146px;
        animation-delay: 0.95s, 1.5s;
      }

      .kw-spark-b {
        transform-origin: 150px 378px;
        animation-delay: 1.1s, 2.1s;
      }

      @keyframes kwSpark {
        from { opacity: 0; transform: scale(0) rotate(-90deg); }
        to   { opacity: 1; transform: scale(1) rotate(0); }
      }

      @keyframes kwTwinkle {
        0%, 100% { opacity: 1; transform: scale(1) rotate(0); }
        50%      { opacity: 0.45; transform: scale(0.7) rotate(45deg); }
      }

      /* One glossy sweep across the tile once everything has landed */
      .kw-shine {
        transform: translateX(-640px) skewX(-20deg);
        animation: kwShine 0.9s ease-in-out 1.15s forwards;
      }

      @keyframes kwShine {
        to { transform: translateX(640px) skewX(-20deg); }
      }

      .kw-wordmark {
        margin: 0;
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--text);
        animation: kwRise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.75s both;
      }

      .kw-wordmark span { color: var(--primary); }

      .kw-tagline {
        margin: -0.5rem 0 0;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-light);
        letter-spacing: 0.02em;
        animation: kwRise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.9s both;
      }

      @keyframes kwRise {
        from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0); filter: blur(0); }
      }

      /* Indeterminate bar, only noticeable when loading takes a while */
      .kw-progress {
        position: relative;
        width: 112px;
        height: 3px;
        margin-top: 0.5rem;
        border-radius: 3px;
        background: var(--border-light);
        overflow: hidden;
        animation: kwRise 0.5s ease 1.3s both;
      }

      .kw-progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        animation: kwSlide 1.2s ease-in-out infinite;
      }

      @keyframes kwSlide {
        from { transform: translateX(-100%); }
        to   { transform: translateX(250%); }
      }

      /* ── Splash modes (picked by the <head> script below) ─────────
         full  – first launch, after an update, or away for hours
         brief – back after a while: the finished mark pops in with one glint
         none  – quick app switch or reload: no splash, only a static logo
                 if loading happens to be slow */
      html[data-splash="brief"] .pwa-loading { transition-duration: 0.3s; }
      html[data-splash="brief"] .kw-stage { gap: 1rem; }
      html[data-splash="brief"] .kw-aura { animation: kwAura 0.4s ease-out both; }
      html[data-splash="brief"] .kw-mark { animation: kwPopBrief 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      html[data-splash="brief"] .kw-back,
      html[data-splash="brief"] .kw-front { animation: none; }
      html[data-splash="brief"] .kw-star { animation: kwStarSpin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
      html[data-splash="brief"] .kw-spark-a,
      html[data-splash="brief"] .kw-spark-b { opacity: 1; animation: kwTwinkle 2s ease-in-out 0.4s infinite; }
      html[data-splash="brief"] .kw-shine { animation: kwShine 0.7s ease-in-out 0.15s forwards; }
      html[data-splash="brief"] .kw-wordmark { animation: kwRise 0.35s ease-out 0.1s both; }
      html[data-splash="brief"] .kw-tagline { display: none; }
      html[data-splash="brief"] .kw-progress { animation: kwRise 0.3s ease 1s both; }

      @keyframes kwPopBrief {
        from { opacity: 0; transform: scale(0.85); }
        to   { opacity: 1; transform: scale(1); }
      }

      @keyframes kwStarSpin {
        from { transform: scale(0.7) rotate(-90deg); }
        to   { transform: scale(1) rotate(0); }
      }

      html[data-splash="none"] .pwa-loading { transition-duration: 0.2s; }
      html[data-splash="none"] .kw-aura { display: none; }
      html[data-splash="none"] .kw-stage * { animation: none; opacity: 1; }
      html[data-splash="none"] .kw-tagline { display: none; }
      html[data-splash="none"] .kw-stage {
        opacity: 0;
        animation: kwLateShow 0.25s ease 0.8s forwards;
      }
      html[data-splash="none"] .pwa-loading.fade-out .kw-stage { transform: none; filter: none; }

      @keyframes kwLateShow {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pwa-loading *,
        .pwa-loading *::after {
          animation: none !important;
          transition: none !important;
        }
        .kw-aura { opacity: 0.18; }
        .kw-shine { display: none; }
        .kw-spark-a, .kw-spark-b { opacity: 1; }
      }

      /* Hide initially until React takes over */
      .app-content {
        opacity: 0;
        transition: opacity 0.4s ease-out;
      }

      .app-content.loaded {
        opacity: 1;
      }
    </style>
    <script>
      /*
       * Decide how much splash this launch deserves, before anything paints.
       * "Away" is measured from the last moment the app was visible, so
       * switching to another app and back quickly never replays the intro.
       * (When the OS keeps the page alive, no splash runs at all.)
       */
      (function () {
        var BRIEF_AFTER = 15 * 60 * 1000;     // away 15 min+  → brief
        var FULL_AFTER = 6 * 60 * 60 * 1000;  // away 6 h+     → full
        var VERSION = '__KW_APP_VERSION__';
        var mode = 'full';

        var markActive = function () {
          try { localStorage.setItem('kwLastActive', String(Date.now())); } catch (e) { /* storage blocked */ }
        };

        try {
          var lastVersion = localStorage.getItem('kwSplashVersion');
          var lastActive = Number.parseInt(localStorage.getItem('kwLastActive'), 10);
          var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
          var navType = nav ? nav.type : 'navigate';
          var away = Date.now() - lastActive;

          // First launch or freshly updated keeps the default 'full'
          if (lastVersion === VERSION && lastActive) {
            if (navType === 'reload' || navType === 'back_forward') {
              mode = 'none';  // the user deliberately refreshed or navigated
            } else if (away < BRIEF_AFTER) {
              mode = 'none';
            } else if (away < FULL_AFTER) {
              mode = 'brief';
            }
          }
          localStorage.setItem('kwSplashVersion', VERSION);
        } catch (e) {
          console.debug('Splash: storage unavailable, using brief intro', e);
          mode = 'brief';  // can't tell how long the user was away, so keep it short
        }

        document.documentElement.dataset.splash = mode;
        globalThis.__kwSplashMode = mode;

        markActive();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') markActive();
        });
        globalThis.addEventListener('pagehide', markActive);
        // Heartbeat in case the OS kills the app without a hidden event
        setInterval(function () {
          if (document.visibilityState === 'visible') markActive();
        }, 60 * 1000);
      })();
    </script>

    <script>
      // PWA loading screen management
      let pwaLoadingHidden = false;
      
      // Hide PWA loading when React app is ready (with minimum display time)
      const hidePwaLoading = () => {
        if (pwaLoadingHidden) return;
        pwaLoadingHidden = true;
        
        const pwaLoading = document.getElementById('pwa-loading');
        const appContent = document.getElementById('root');
        
        if (pwaLoading && appContent) {
          // Add fade out animation
          pwaLoading.classList.add('fade-out');
          appContent.classList.add('loaded');
          
          // Remove PWA loading element after animation completes
          setTimeout(() => {
            if (pwaLoading.parentNode) {
              pwaLoading.parentNode.removeChild(pwaLoading);
            }
          }, splashMode === 'full' ? 600 : 400);
        }
      };

      // How long each splash mode stays up at minimum (mode set in <head>)
      const splashMode = globalThis.__kwSplashMode || 'full';
      const minDisplayTime = { full: 1400, brief: 500, none: 0 }[splashMode];
      let startTime = Date.now();
      let reactReady = false;

      // React app ready signal
      globalThis.addEventListener('app-ready', () => {
        reactReady = true;
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, minDisplayTime - elapsed);
        
        setTimeout(hidePwaLoading, remaining);
      });

      // Fallback: hide after maximum time even if React doesn't signal ready
      setTimeout(() => {
        if (!pwaLoadingHidden) {
          console.warn('React app did not signal ready, hiding PWA loading after timeout');
          hidePwaLoading();
        }
      }, 3000);

      // Theme detection and persistence
      const resolveTheme = () => {
        try {
          const useSystem = localStorage.getItem('useSystemTheme');
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
          if (useSystem === 'false' && savedTheme) return savedTheme;
          return prefersDark ? 'dark' : 'light';
        } catch (e) {
          return 'light';
        }
      };

      const initTheme = (theme) => {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      };

      /*
       * Paint the user's accent before React boots. The provider writes a cache
       * of the derived tokens for both themes on every change, so this only has
       * to read and apply strings — no colour maths in the critical path. If the
       * cache is missing or malformed we simply keep the stylesheet default.
       */
      const initAccent = (theme) => {
        try {
          const raw = localStorage.getItem('accentTokenCache');
          if (!raw) return;
          const tokens = JSON.parse(raw)[theme];
          if (!tokens) return;
          const root = document.documentElement;
          Object.keys(tokens).forEach((token) => {
            if (token.indexOf('--') === 0 && typeof tokens[token] === 'string') {
              root.style.setProperty(token, tokens[token]);
            }
          });
        } catch (e) {
          // Corrupt cache: fall back to the stylesheet defaults.
        }
      };

      // Initialize theme immediately
      const initialTheme = resolveTheme();
      initTheme(initialTheme);
      initAccent(initialTheme);
    </script>
  </body>
</html>
