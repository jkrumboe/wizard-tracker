# ============================================
# Nginx Logging Configuration
# ============================================
# See docs/LOGGING.md for detailed documentation
#
# Available formats:
#   - json_combined: Machine-readable, best for Grafana/Loki
#   - readable: Human-friendly multiline format
#   - minimal: One-line compact format
#
# To switch formats, change the access_log line below
# ============================================

# JSON log format for machine parsing (Grafana, Loki, ELK)
log_format json_combined escape=json
'{'
  '"timestamp":"$time_iso8601",'
  '"client_ip":"$remote_addr",'
  '"real_ip":"$http_x_real_ip",'
  '"method":"$request_method",'
  '"path":"$request_uri",'
  '"protocol":"$server_protocol",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"referrer":"$http_referer",'
  '"user_agent":"$http_user_agent",'
  '"host":"$host"'
'}';

# Human-readable format for development/debugging
log_format readable
'[$time_local] $request_method $request_uri'
'\n  Status: $status  |  Bytes: $body_bytes_sent  |  Time: ${request_time}s'
'\n  Client: $remote_addr  |  Real IP: $http_x_real_ip'
'\n  Referrer: $http_referer'
'\n  Agent: $http_user_agent\n';

# Minimal format for cleaner logs
log_format minimal
'[$time_local] $status $request_method $request_uri ($request_time s) - $remote_addr';

# Cache-Control per path. Sent from the server block together with the
# security headers: nginx drops every inherited add_header in a location that
# sets one of its own, so locations below must not use add_header (or expires,
# which would send a second Cache-Control). Exact paths beat the regexes, and
# the regexes are tried in order. $uri is the final URI after try_files, so the
# SPA fallback and the prerendered pages resolve to an index.html (default).
# An empty value sends no header: the API sets its own.
map $uri $cache_control {
    default                 "no-cache";
    /service-worker.js      "no-cache";
    ~^/api/                 "";
    # Fingerprinted build assets never change under the same name
    ~^/assets/              "public, max-age=31536000, immutable";
    ~*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$  "public, max-age=604800";
}

server {
    # IPv6 too: in nginx:alpine "localhost" resolves to ::1, so a healthcheck
    # against http://localhost is refused when only IPv4 is bound.
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;
    etag on;

    # Use JSON format for access logs (recommended for production)
    # Change to 'readable' or 'minimal' for development
    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # No `always`, so 404s and errors are never cached (see the map above)
    add_header Cache-Control $cache_control;

    # CSP for PWA and inline scripts (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cf.geekdo-images.com https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' http://localhost:5000 ws://localhost:5000 https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com; manifest-src 'self'; worker-src 'self' blob:;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Handle API requests - proxy to backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # index.html and the per-route copies from scripts/prerender-seo.js (e.g.
    # /leaderboard/index.html). The map above makes them revalidate every time,
    # so the app shell never references stale assets.
    location ~ /index\.html$ {
        try_files $uri =404;
    }

    # Service worker and manifests must never be long-cached (see the map above).
    location = /service-worker.js {
        try_files $uri =404;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
    }

    # Fingerprinted build assets: a missing one is a 404, never the SPA shell.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Other static files are cached for a week (see the map above).
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # SPA fallback for non-file routes. $uri/index.html serves the prerendered
    # pages (scripts/prerender-seo.js) without nginx's 301 to a trailing slash,
    # which would contradict their slash-less canonical URLs.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
